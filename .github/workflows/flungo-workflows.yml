# Caller for the reusable github-workflows version check: raises (and
# auto-closes) an issue here if this repo ever pins a frozen @vN major. See
# flungo/github-workflows docs/runbooks/adopting-flungo-workflows.md.
name: flungo/github-workflows

on:
  schedule:
    - cron: '0 7 * * 1' # weekly
  workflow_dispatch:

jobs:
  flungo-workflows:
    permissions:
      contents: read
      issues: write
    uses: flungo/github-workflows/.github/workflows/flungo-workflows.yml@v2

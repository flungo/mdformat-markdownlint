# MD003 heading-style at the preset's `atx`: setext headings and closed ATX
# headings are rewritten as open ATX by mdformat alone, and an open ATX
# heading beside them is left as it is.
status = "guaranteed"
rule = "MD003"

[inputs."setext.md"]
findings = 2

[inputs."closed-atx.md"]
findings = 1

[inputs."atx.md"]
findings = 0
unchanged = true

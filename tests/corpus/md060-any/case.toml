# MD060 table-column-style at `any`, markdownlint's default in place of the
# preset's `aligned`: a table that is neither compact nor aligned is a
# finding, and mdformat alone pads it to aligned; a compact table reports
# nothing and is padded to aligned, which the style accepts, and an aligned
# table is left as it is. The plugin derives nothing from `any`, which
# accepts what mdformat writes either way (ADR-005).
status = "guaranteed"
rule = "MD060"

[inputs."misaligned-table.md"]
from = "misaligned-table.md"
findings = 1
rewritten = true

[inputs."compact-tables.md"]
from = "compact-tables.md"
findings = 0
rewritten = true

[inputs."aligned-tables.md"]
from = "aligned-tables.md"
findings = 0
unchanged = true

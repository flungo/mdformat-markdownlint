# MD054 link-image-style with `url_inline` false: the inline link whose text
# is its destination, which could be an autolink, is the finding, and
# mdformat keeps it as written rather than make it one; the collapsed
# reference beside it is what formatting rewrites, as a shortcut, which
# changes nothing this configuration classifies.
status = "neutral"
rule = "MD054"

[inputs."link-styles.md"]
from = "link-styles.md"
findings = 1
rewritten = true

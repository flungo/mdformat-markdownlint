# The baseline ADR-002 states: a document that lints clean with no markdownlint
# configuration at all still lints clean after formatting. No rule is named,
# so every finding counts, and no configuration file is present, so
# markdownlint runs on its defaults. One document is written in mdformat's own
# style, so formatting writes it back byte for byte; the other is consistent
# in every style markdownlint's defaults leave open, setext headings, asterisk
# bullets, tilde fences, a dashed break, a compact table and 1, 2, 3 numbering,
# so markdownlint accepts it before and after while mdformat rewrites all of it;
# it comes from the shared pool, and the preset's baseline runs the same file.
status = "guaranteed"

[inputs."clean.md"]
findings = 0
unchanged = true

[inputs."consistent.md"]
from = "consistent.md"
findings = 0
rewritten = true

# MD035 hr-style at the preset's explicit style of seventy underscores: a
# dash, asterisk or short underscore break, alone or beside the preset's
# break, is rewritten as seventy underscores by mdformat alone, and a
# document of the preset's breaks is left as it is. Every document is
# pooled: the `consistent` case runs the same files, and reports nothing on
# the one whose breaks are all dashes.
status = "guaranteed"
rule = "MD035"

[inputs."dash-breaks.md"]
from = "dash-breaks.md"
findings = 2
rewritten = true

[inputs."dash-then-underscore-breaks.md"]
from = "dash-then-underscore-breaks.md"
findings = 1
rewritten = true

[inputs."asterisk-then-underscore-breaks.md"]
from = "asterisk-then-underscore-breaks.md"
findings = 1
rewritten = true

[inputs."short-then-long-underscore-breaks.md"]
from = "short-then-long-underscore-breaks.md"
findings = 1
rewritten = true

[inputs."underscore-breaks.md"]
from = "underscore-breaks.md"
findings = 0
unchanged = true

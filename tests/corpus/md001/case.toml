# MD001 heading-increment at its default: a heading that skips a level is
# content, so mdformat reports the same findings before and after rewriting
# the setext headings around it as ATX. With the default `front_matter_title`,
# a front-matter title counts as a level-one heading, so a level-three heading
# after it skips a level too; that document is pooled, and the case with the
# option empty reports one finding on it where this one reports two.
status = "neutral"
rule = "MD001"

[inputs."setext-headings-then-skipped-levels.md"]
findings = 2
rewritten = true

[inputs."front-matter-title-then-skipped-levels.md"]
from = "front-matter-title-then-skipped-levels.md"
findings = 2
unchanged = true

[inputs."levels-increment-by-one.md"]
findings = 0
unchanged = true

[inputs."open-atx-headings.md"]
from = "open-atx-headings.md"
findings = 0
unchanged = true

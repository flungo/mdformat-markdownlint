# MD022 blanks-around-headings at its default of one line above and one
# below: a heading written directly against the paragraphs around it is
# separated from them by exactly one blank line by mdformat alone, which is
# what the rule asks for, and a document already so separated is left as it
# is. A heading inside a tight list item is the exception the matrix states
# and is not in this case.
status = "guaranteed"
rule = "MD022"

[inputs."heading-without-blank-lines.md"]
findings = 2
rewritten = true

[inputs."open-atx-headings.md"]
from = "open-atx-headings.md"
findings = 0
unchanged = true

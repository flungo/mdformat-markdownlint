# MD034 no-bare-urls: a bare `www.` literal and a bare email address are
# findings and are left as written by mdformat, so the findings survive
# formatting; the setext heading beside them is what formatting rewrites.
# An email address in angle brackets is an autolink, not bare, and is left
# as it is. A bare URL with a scheme is the same construct to the rule and
# is not here because the repository's link check reads these documents.
status = "neutral"
rule = "MD034"

[inputs."bare-literals.md"]
findings = 2
rewritten = true

[inputs."email-autolink.md"]
findings = 0
unchanged = true

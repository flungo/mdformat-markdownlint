# MD054 link-image-style with `autolink` false: the email autolink is the
# finding and mdformat keeps it as written, so the finding survives
# formatting; the collapsed reference beside it is what formatting rewrites,
# as a shortcut, which changes nothing this configuration classifies.
status = "neutral"
rule = "MD054"

[inputs."link-styles.md"]
from = "link-styles.md"
findings = 1
rewritten = true

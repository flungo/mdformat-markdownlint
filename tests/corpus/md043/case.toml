# MD043 required-headings with a `headings` structure of a title, a `Setup`
# section and anything after; the rule checks nothing without one. A document
# whose second heading is `Usage` is a finding before and after mdformat
# rewrites its setext title as ATX; with `match_case` at its default of
# false, one whose second heading is `setup` matches and reports nothing.
status = "neutral"
rule = "MD043"

[inputs."heading-text-differs.md"]
from = "heading-text-differs.md"
findings = 1
rewritten = true

[inputs."heading-case-differs.md"]
from = "heading-case-differs.md"
findings = 0
rewritten = true

[inputs."heading-structure-matches.md"]
from = "heading-structure-matches.md"
findings = 0
unchanged = true

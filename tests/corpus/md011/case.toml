# MD011 no-reversed-links: reversed link syntax is plain text to the parser
# and mdformat leaves it as written, so the finding survives formatting; the
# single-quoted title of the link beside it is what formatting rewrites, as
# double quotes.
status = "neutral"
rule = "MD011"

[inputs."reversed-link.md"]
findings = 1
rewritten = true

[inputs."link.md"]
findings = 0
unchanged = true

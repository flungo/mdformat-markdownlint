# MD045 no-alt-text: an image with no alternate text is content mdformat
# leaves as written, so the finding survives formatting; the angle brackets
# around its destination are what formatting rewrites, removing them. The
# image's destination is the case's own manifest so the repository's link
# check resolves it.
status = "neutral"
rule = "MD045"

[inputs."image-without-alt-text.md"]
findings = 1
rewritten = true

[inputs."image.md"]
findings = 0
unchanged = true
